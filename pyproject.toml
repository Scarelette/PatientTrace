[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angel-demo"
version = "0.1.0"
description = "PatientTrace (ANGEL demo): interview a simulated patient, trace replies onto its symptom network, find contrast patients and compare two patients side by side."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "requests>=2.31",
    "numpy>=1.24",
    "anthropic>=0.111.0",
    "openai>=1.40",
    "huggingface_hub>=0.23",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Only on the machine that runs the patient model (`angel-demo worker`).
gpu = ["vllm>=0.10", "torch", "transformers"]

[project.scripts]
angel-demo = "angel_demo.cli:main"

[tool.setuptools.packages.find]
include = ["angel_demo*"]

[tool.setuptools.package-data]
angel_demo = ["static/*"]
