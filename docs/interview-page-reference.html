:root {

  --shadow:0 12px 32px rgba(0,0,0,.55); color-scheme:dark; }

html, body { height:100%; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 var(--font); }
button { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
button:hover:not(:disabled) { border-color:var(--accent); }
button:focus-visible, .msg.p .bubble:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button:disabled { opacity:.5; cursor:default; }

.app { height:100%; display:flex; flex-direction:column; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:12px; gap:12px; box-sizing:border-box; }
.top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.avatar { width:36px; height:36px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:650; }
.who { display:flex; align-items:center; gap:10px; margin-right:auto; min-width:0; }
.name { font-weight:650; font-size:15px; }
.name .meta, .sub { color:var(--muted); font-weight:400; font-size:12.5px; }
.cov { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }

.grid { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,560px); gap:12px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; }
.chat { display:flex; flex-direction:column; min-height:0; }
#log { list-style:none; margin:0; padding:16px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
.composer { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
.composer input { flex:1; min-width:0; font:inherit; color:var(--muted); background:var(--raise); border:1px solid var(--line); border-radius:999px; padding:8px 14px; }

.msg { display:flex; flex-direction:column; max-width:78%; animation:rise .32s ease both; }
.msg.t { align-self:flex-end; align-items:flex-end; }
.msg.p { align-self:flex-start; }
.who-l { font-size:11.5px; color:var(--muted); margin:0 6px 3px; letter-spacing:.02em; }
.bubble { padding:10px 14px; border-radius:16px; line-height:1.55; }
.msg.t .bubble { background:var(--trainee); color:var(--trainee-ink); border-bottom-right-radius:5px; }
.msg.p .bubble { background:var(--panel); border:1px solid var(--line); border-bottom-left-radius:5px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
.msg.p .bubble:hover, .msg.p.pinned .bubble { border-color:var(--accent); }
.msg.p.pinned .bubble { box-shadow:0 0 0 3px var(--accent-soft); }
.trig-word { text-decoration:underline dotted 1.5px; text-underline-offset:3px; }
.sp { background:transparent; color:inherit; text-decoration:underline 2px var(--c); text-underline-offset:4px; border-radius:3px; transition:background .2s; }
.sp.ez { text-decoration-style:dashed; }
.msg.p:hover .sp, .msg.p.pinned .sp { background:color-mix(in srgb, var(--c) 16%, transparent); }
.dots { display:flex; gap:4px; margin:6px 6px 0; flex-wrap:wrap; align-items:center; }
.dots i { width:7px; height:7px; border-radius:50%; background:var(--c); }
.dots .tag { font-size:11px; color:var(--muted); margin-left:4px; }
.dots .tag.loop { color:var(--accent); }
.typing .bubble { display:flex; gap:4px; padding:14px; }
.typing .bubble i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1s infinite; }
.typing .bubble i:nth-child(2) { animation-delay:.15s; } .typing .bubble i:nth-child(3) { animation-delay:.3s; }

.side { display:flex; flex-direction:column; gap:12px; min-height:0; overflow:auto; }
.card-h { display:flex; align-items:baseline; gap:8px; padding:12px 16px 0; flex-wrap:wrap; }
.card-h h2 { font-size:13px; margin:0; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); font-weight:600; }
.cap { font-size:12.5px; color:var(--muted); margin-left:auto; }
.cap b { color:var(--accent); font-weight:600; }
.svgwrap { overflow-x:auto; padding:0 8px; }
#net { display:block; width:100%; min-width:460px; height:auto; }
.colh { font-size:10.5px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
.e { fill:none; stroke:var(--edge); stroke-width:1; opacity:.55; }
.fx { fill:none; stroke-width:2.2; stroke-linecap:round; }
.fx.flow { stroke-dasharray:6 5; animation:flow .9s linear infinite; }
.nd .dot { stroke:var(--panel); stroke-width:1.5; fill-opacity:.28; transition:fill-opacity .3s, r .3s; }
.nd .lb { font-size:10.5px; fill:var(--muted); text-anchor:middle; transition:fill .3s; }
.nd .halo { fill:none; stroke-width:2; opacity:0; transform-box:fill-box; transform-origin:center; }
.nd.seen .dot { fill-opacity:.7; }
.nd.on .dot { fill-opacity:1; r:7; }
.nd.on .lb { fill:var(--ink); font-weight:650; }
.nd.on .halo { animation:pulse 1.6s ease-out infinite; }
.nd.ez .dot { fill-opacity:0; stroke:var(--ease); stroke-dasharray:2 2; r:7; }
.nd.ez .lb { fill:var(--ease); font-style:italic; }
.nd.hl .dot { r:9; fill-opacity:1; }
.nd.hl .lb { fill:var(--ink); font-weight:650; }
.legend { display:flex; gap:12px; flex-wrap:wrap; padding:4px 16px 10px; font-size:11.5px; color:var(--muted); }
.legend span { display:inline-flex; align-items:center; gap:5px; }
.legend i { width:8px; height:8px; border-radius:50%; background:var(--c); }
.legend i.ring { background:none; border:1.5px dashed var(--ease); }
.unexp { padding:0 16px 12px; font-size:12.5px; color:var(--muted); }
.unexp b { color:var(--ink); font-weight:600; }

#detail { padding:14px 16px 16px; display:flex; flex-direction:column; gap:12px; }
#detail.swap { animation:rise .3s ease both; }
.eyebrow { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
#detail h3 { margin:2px 0 0; font-size:17px; text-wrap:balance; }
#detail h4, .pop h4 { margin:0 0 4px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; }
#detail p { margin:0; }
.chip { display:inline-flex; align-items:center; gap:5px; padding:2px 9px 2px 7px; border-radius:999px; font-size:12px; font-weight:600; background:color-mix(in srgb, var(--c) 14%, transparent); color:var(--ink); white-space:nowrap; }
.chip i { width:7px; height:7px; border-radius:50%; background:var(--c); }
.chip.ez { background:transparent; border:1px dashed var(--ease); color:var(--ease); }
.trig { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; }
.trig q { font-style:italic; }
.chain { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0; }
.chain li { display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; align-items:start; padding:6px 0; position:relative; }
.chain li + li::before { content:""; position:absolute; left:10px; top:-6px; height:12px; border-left:1.5px solid var(--line); }
.chain .q { color:var(--muted); font-size:13px; padding-top:1px; }
.chain .q em { color:var(--ink); }
.two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.two > div { background:var(--raise); border-radius:10px; padding:10px 12px; min-width:0; }
.ev { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
.ev li { color:var(--muted); }
.ev .arr { color:var(--ink); font-weight:600; }
.tip { border-left:3px solid var(--accent); background:var(--accent-soft); border-radius:0 10px 10px 0; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
.tip .try { font-size:13px; }
.nav { display:flex; gap:8px; flex-wrap:wrap; }
.loopnote { font-size:12.5px; color:var(--accent); font-weight:600; }

.pop { position:fixed; z-index:20; width:340px; max-width:calc(100vw - 24px); background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:12px 14px; pointer-events:none; display:flex; flex-direction:column; gap:10px; animation:popin .16s ease both; font-size:13px; }
.pop .ttl { font-weight:650; font-size:14px; }
.pop .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.pop .two > div { padding:8px 10px; }
.pop .foot { font-size:11.5px; color:var(--muted); }

@keyframes rise { from { opacity:0; transform:translateY(8px); } }
@keyframes popin { from { opacity:0; transform:translateY(4px) scale(.98); } }
@keyframes blink { 50% { opacity:.25; } }
@keyframes pulse { 0% { opacity:.7; transform:scale(.7); } 100% { opacity:0; transform:scale(2); } }
@keyframes flow { to { stroke-dashoffset:-22; } }
@media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }

@media (max-width: 900px) {
  html, body { height:auto; }
  .app { height:auto; }
  .grid { grid-template-columns:minmax(0,1fr); }
  #log { max-height:none; }
  .msg { max-width:92%; }
  .side { overflow:visible; }
  .two { grid-template-columns:1fr; }
}

    li.innerHTML = `<div class="who-l">Emily</div><div class="bubble" tabindex="0" role="button" aria-label="Show what's happening in this reply">${markText(t)}</div>
      <div class="dots">${types.map(x => `<i style="--c:var(${TYPES[COL[x]].v})" title="${esc(TYPES[COL[x]].lab)}"></i>`).join("")}
      <span class="tag${loop ? " loop" : ""}">${esc(t.title)}${loop ? " · loop" : ""}${(t.eased || []).length ? " · easing" : ""}</span></div>`;
    const b = li.querySelector(".bubble");
    b.addEventListener("mouseenter", () => hoverStart(i, b));
    b.addEventListener("mouseleave", hoverEnd);
    b.addEventListener("click", () => pin(i, true));
    b.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pin(i, true); } });
    li.querySelectorAll(".sp").forEach(m => { m.addEventListener("mouseenter", () => nodeEl[m.dataset.n]?.classList.add("hl"));
      m.addEventListener("mouseleave", () => nodeEl[m.dataset.n]?.classList.remove("hl")); });
  }
  log.appendChild(li); return li;
}

// ---- explanations: compact on hover, full when pinned ----
function chainHTML(t, max) {
  const quote = n => (t.spans.find(s => s[1] === n) || [])[0];
  const ns = t.active.slice().sort(byFlow).slice(0, max || 99);
  return `<ol class="chain">${ns.map(n => `<li>${chip(n)}<span class="q">${quote(n) ? `“<em>${esc(quote(n))}</em>”` : n === t.trigger?.node ? "set off by your question" : TYPE_OF[n] === "Stimulus" ? "background" : "implied, not said"}</span></li>`).join("")}
    ${(t.eased || []).map(n => `<li>${chip(n, true)}<span class="q">eased${quote(n) ? `: “<em>${esc(quote(n))}</em>”` : ""}</span></li>`).join("")}</ol>`;
}
const trigHTML = t => t.trigger ? `<div class="trig">Triggered by <q>${esc(t.trigger.phrase)}</q> → ${chip(t.trigger.node)}</div>` : "";
function popHTML(i) {
  const t = TURNS[i], loop = loopEdges(t.path || []).size > 0;
  return `<div><div class="eyebrow">Reply ${patientIdx.indexOf(i) + 1} · what's happening</div><div class="ttl">${esc(t.title)}</div></div>
    ${trigHTML(t)}${chainHTML(t, 5)}
    ${loop ? `<div class="loopnote">Maintaining loop: these reactions feed each other, so the cycle keeps itself going.</div>` : ""}
    <div class="two"><div><h4>She shows</h4>${esc(t.surface)}</div><div><h4>Underneath</h4>${esc(t.under)}</div></div>
    <div class="foot">Click to pin the full explanation</div>`;
}
function detailHTML(i) {
  const t = TURNS[i], path = t.path || [], loops = loopEdges(path);
  return `<div><div class="eyebrow">Reply ${patientIdx.indexOf(i) + 1} of ${patientIdx.length} · pinned</div><h3>${esc(t.title)}</h3></div>
    ${trigHTML(t)}
    <div><h4>What she expresses</h4>${chainHTML(t)}</div>
    ${loops.size ? `<div class="loopnote">Maintaining loop (blue, moving): ${[...loops].map(k => k.split("→").map(short).join(" → ")).map(esc).join("; ")}</div>` : ""}
    <div class="two"><div><h4>She shows</h4><p>${esc(t.surface)}</p></div><div><h4>Underneath</h4><p>${esc(t.under)}</p></div></div>
    ${path.length ? `<div><h4>Why these links (from her profile)</h4><ul class="ev">${path.map(([a, b]) => `<li><span class="arr">${esc(short(a))} → ${esc(short(b))}</span>: ${esc(EVID[a + "→" + b] || "")}</li>`).join("")}</ul></div>` : ""}
    <div class="tip"><h4>For the trainee</h4><p>${esc(t.tip)}</p><p class="try"><b>You could try:</b> “${esc(t.instead)}”</p></div>
    <div class="nav"><button type="button" id="prev">← Previous reply</button> <button type="button" id="next">Next reply →</button></div>`;
}
let pinned = null, hoverT = null, hovering = null;
const pop = $("#pop"), canHover = matchMedia("(hover: hover)").matches;
function pin(i, animate) {
  pinned = i;
  log.querySelectorAll(".msg.p").forEach(m => m.classList.toggle("pinned", +m.dataset.i === i));
  const d = $("#detail"); d.classList.remove("swap"); void d.offsetWidth; d.classList.add("swap");
  d.innerHTML = detailHTML(i);
  const k = patientIdx.indexOf(i);
  $("#prev").disabled = k <= 0; $("#next").disabled = k >= patientIdx.length - 1 || !log.querySelector(`[data-i="${patientIdx[k + 1]}"]`);
  $("#prev").onclick = () => { const j = patientIdx[k - 1]; pin(j, true); scrollToMsg(j); };
  $("#next").onclick = () => { const j = patientIdx[k + 1]; pin(j, true); scrollToMsg(j); };
  pop.hidden = true; hovering = null;
  showTurn(i, animate);
}
const scrollToMsg = i => log.querySelector(`[data-i="${i}"]`)?.scrollIntoView({ block: "nearest", behavior: REDUCED ? "auto" : "smooth" });
function hoverStart(i, bubble) {
  if (!canHover) return;
  clearTimeout(hoverT);
  hoverT = setTimeout(() => {
    hovering = i;
    pop.innerHTML = popHTML(i); pop.hidden = false; pop.style.animation = "none"; void pop.offsetWidth; pop.style.animation = "";
    const r = bubble.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    // stay inside the transcript column so the network panel stays visible while it animates
    const c = log.getBoundingClientRect(), wide = innerWidth > 900;
    let x = wide ? Math.min(r.left + 24, c.right - pw - 8) : Math.max(12, Math.min(r.left, innerWidth - pw - 12));
    let y = r.bottom + 8;
    if (y + ph > innerHeight - 12) y = r.top - ph - 8;
    if (y < 12) { y = 12; if (wide) x = Math.max(c.left + 8, r.right - pw); }
    x = Math.max(12, x);
    pop.style.left = x + "px"; pop.style.top = y + "px";
    if (i !== pinned) showTurn(i, true);
  }, 110);
}
function hoverEnd() {
  clearTimeout(hoverT); pop.hidden = true;
  if (hovering != null && hovering !== pinned && pinned != null) showTurn(pinned, false);
  hovering = null;
}

// ---- replay: messages arrive one by one and the network lights up as Emily answers ----
let playing = false, runId = 0;
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
async function replay() {
  const id = ++runId; playing = true; setPlay();
  log.innerHTML = ""; pinned = null; $("#detail").innerHTML = `<div class="eyebrow">Replaying</div><p>Each reply lights up the parts of Emily's network it expresses.</p>`;
  clearTimers(); gFx.innerHTML = ""; Object.values(nodeEl).forEach(g => g.classList.remove("seen", "on", "ez", "hl"));
  $("#netcap").textContent = ""; $("#unexp").textContent = ""; $("#cov").textContent = "";
  for (let i = 0; i < TURNS.length; i++) {
    if (id !== runId) return;
    if (TURNS[i].who === "p") {
      const ty = document.createElement("li"); ty.className = "msg p typing";
      ty.innerHTML = `<div class="who-l">Emily</div><div class="bubble"><i></i><i></i><i></i></div>`; log.appendChild(ty); scrollToMsg(-1); ty.scrollIntoView({ block: "nearest" });
      await sleep(900 + TURNS[i].text.length * 6); if (id !== runId) return; ty.remove();
      renderMsg(i); scrollToMsg(i); pin(i, true);
      await sleep(1400 + (TURNS[i].path || []).length * 420);
    } else { renderMsg(i); scrollToMsg(i); await sleep(700); }
  }
  playing = false; setPlay();
}
function stopReplay() { runId++; playing = false; log.innerHTML = ""; TURNS.forEach((_, i) => renderMsg(i)); pin(patientIdx[1], false); setPlay(); }
function setPlay() { $("#play span").textContent = playing ? "Stop replay" : "Replay session"; }
$("#play").onclick = () => playing ? stopReplay() : replay();

// start complete: full transcript, the checking loop pinned
TURNS.forEach((_, i) => renderMsg(i));
pin(patientIdx[1], false);
</script>
